name: Build macOS Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python venv + Install PyInstaller
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install pyinstaller

      - name: Build Executable
        run: |
          source venv/bin/activate
          pyinstaller --onefile main.py

      - name: Dump binary as base64 to logs
        run: |
          echo "::group::BEGIN BASE64 OUTPUT"
          base64 dist/main
          echo "::endgroup::END BASE64 OUTPUT"