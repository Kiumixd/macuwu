name: Build macOS Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python venv + Install PyInstaller
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install pyinstaller

      - name: Build Executable
        run: |
          source venv/bin/activate
          pyinstaller --onefile main.py

      - name: Zip the executable
        run: |
          mkdir upload
          cp dist/main upload/
          zip -r macos-executable.zip upload

      - name: Upload artifact manually
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary "@macos-executable.zip" \
            "https://pipelines.actions.githubusercontent.com/_apis/pipelines/workflows/${{ github.run_id }}/artifacts?artifactName=macos-executable&api-version=6.0-preview"
